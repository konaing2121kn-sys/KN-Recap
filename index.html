<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>မြန်မာ AI Dubbing</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#0f1115;color:#eee}
  .card{max-width:520px;margin:0 auto;background:#1a1d24;border-radius:14px;padding:18px}
  h1{font-size:20px;margin:0 0 14px}
  input,button{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border-radius:10px;border:0;margin-top:10px}
  input{background:#262a33;color:#eee}
  button{background:#3b82f6;color:#fff;font-weight:600}
  button:disabled{opacity:.5}
  #bar{height:8px;background:#262a33;border-radius:4px;margin-top:12px;overflow:hidden;display:none}
  #bar div{height:100%;width:0;background:#3b82f6}
  #msg{margin-top:12px;line-height:1.5}
  video{width:100%;margin-top:12px;border-radius:10px}
  a.dl{display:block;text-align:center;margin-top:10px;color:#7db3ff}
  .note{font-size:13px;color:#9aa3b2;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>🎬 မြန်မာအသံ + စာတန်းထိုး (AI)</h1>
  <input id="code" type="password" placeholder="Access code (ရှိရင်)">
  <input id="file" type="file" accept="video/*">
  <button id="go">စတင်မယ်</button>
  <div id="bar"><div></div></div>
  <div id="msg"></div>
  <div id="out"></div>
  <p class="note">ကိုယ်ပိုင်အသုံးအတွက်သာ။ copyright ရှိတဲ့ video တွေကို ကိုယ့်တာဝန်နဲ့သာ သုံးပါ။ Video တိုတိုနဲ့ အရင်စမ်းပါ။</p>
</div>
<script>
const $ = id => document.getElementById(id);
const bar = $("bar"), fill = bar.firstElementChild;

$("go").onclick = () => {
  const f = $("file").files[0];
  if (!f) { $("msg").textContent = "Video ရွေးပါ"; return; }
  const code = $("code").value;
  $("go").disabled = true; $("out").innerHTML = ""; bar.style.display = "block";
  const fd = new FormData(); fd.append("file", f);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/jobs");
  xhr.setRequestHeader("X-Access-Code", code);
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      fill.style.width = (e.loaded / e.total * 100) + "%";
      $("msg").textContent = "Upload လုပ်နေပါတယ် " + Math.round(e.loaded / e.total * 100) + "%";
    }
  };
  xhr.onload = () => {
    if (xhr.status !== 200) {
      let d = ""; try { d = JSON.parse(xhr.responseText).detail } catch (e) {}
      fail(d || "Upload မအောင်မြင်ပါ"); return;
    }
    poll(JSON.parse(xhr.responseText).id);
  };
  xhr.onerror = () => fail("ချိတ်ဆက်မရပါ");
  xhr.send(fd);
};

function fail(t) { $("msg").textContent = "❌ " + t; $("go").disabled = false; bar.style.display = "none"; }

function poll(id) {
  fill.style.width = "100%";
  const t = setInterval(async () => {
    try {
      const j = await (await fetch("/api/jobs/" + id)).json();
      if (j.status === "running") { $("msg").textContent = "⏳ " + j.step; return; }
      clearInterval(t);
      if (j.status === "error") { fail(j.error); return; }
      $("msg").textContent = "✅ ပြီးပါပြီ";
      $("out").innerHTML =
        '<video controls playsinline src="/api/jobs/' + id + '/result"></video>' +
        '<a class="dl" href="/api/jobs/' + id + '/result" download>⬇️ Video ဒေါင်းလုဒ်</a>' +
        '<a class="dl" href="/api/jobs/' + id + '/srt" download>⬇️ စာတန်း (.srt)</a>';
      $("go").disabled = false; bar.style.display = "none";
    } catch (e) { /* retry on next tick */ }
  }, 3000);
}
</script>
</body>
</html>
